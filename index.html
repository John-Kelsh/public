<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏰ Meine Uhrzeit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #333;
            padding: 10px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
        }
        nav a:hover {
            color: #007bff;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .time {
            font-size: 2.5em;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
        }
        .time .hour {
            font-size: 3em;
        }
        .time .minute {
            font-size: 2em;
        }
        .time .second {
            font-size: 1.5em;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        .footer-links {
            margin-top: 15px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            .time .hour {
                font-size: 3.5em;
            }
            .time .minute {
                font-size: 2.5em;
            }
            .time .second {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🕐 Meine Uhrzeit</h1>
    </header>
    
    <nav>
        <a href="#zeit">Zeit</a>
        <a href="#date">Datum</a>
    </nav>

    <main>
        <div class="container">
            <section id="zeit">
                <h2>⏰ Aktuelle Uhrzeit</h2>
                <div class="time">
                    <div class="time .hour">00:00:00</div>
                    <div class="time .minute">00:00</div>
                    <div class="time .second">00:00:00</div>
                </div>
            </section>

            <section id="date">
                <h2>📅 Datum</h2>
                <div class="time" style="display: flex; justify-content: space-between;">
                    <div class="time" style="color: #666;">2023</div>
                    <div class="time" style="color: #666;">12</div>
                </div>
            </section>

            <section id="info">
                <h2>📞 Kontakt</h2>
                <p>
                    Wenn du Fragen hast, kannst du uns kontaktieren.<br>
                    <a href="mailto:kontakt@deine-website.de">kontakt@deine-website.de</a>
                </p>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Meine Uhrzeit</p>
        <div class="footer-links">
            <a href="#zeit">Zeit</a>
            <a href="#date">Datum</a>
        </div>
        <p class="btn">Mehr erfahren</p>
    </footer>
</body>
</html>
